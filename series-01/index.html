const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog  = (t, a, b) => clamp((t - a) / (b - a));

// Rich text: *word* = accent. Returns height. Supports \n.
function parseRich(s) {
  const toks = []; let acc = false, glue = false;
  for (const p of s.split(/(\*|\n)/)) {
    if (p === '*') { acc = !acc; continue; }
    if (p === '\n') { toks.push({ br: true }); glue = false; continue; }
    if (!p) continue;
    p.split(' ').forEach((w, i) => {
      if (i > 0) glue = false;
      if (w === '') return;
      const prev = toks[toks.length - 1];
      toks.push({ w, acc, glue: glue && prev && !prev.br });
      glue = true;
    });
    if (p.endsWith(' ')) glue = false;
  }
  return toks;
}
function rich(s, x, y, maxW, o = {}) {

  const toks = parseRich(s);
  ctx.font = font(size, weight); const space = ctx.measureText(' ').width;
  const lines = [[]]; let lw = 0;
  for (const tk of toks) {
    if (tk.br) { lines.push([]); lw = 0; continue; }
    tk.wt = tk.acc && accWeight ? accWeight : weight;
    ctx.font = font(size, tk.wt); tk.width = ctx.measureText(tk.w).width;
    const cur = lines[lines.length - 1];
    const gap = cur.length && !tk.glue ? space : 0;
    if (cur.length && !tk.glue && lw + gap + tk.width > maxW) { tk.x = 0; lines.push([tk]); lw = tk.width; }
    else { tk.x = lw + gap; cur.push(tk); lw += gap + tk.width; }
  }
  const L = size * lh;
  if (draw) {
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    lines.forEach((ln, i) => {
      if (!ln.length) return;
      const lineW = ln[ln.length - 1].x + ln[ln.length - 1].width;
      const ox = align === 'center' ? x - lineW / 2 : align === 'right' ? x - lineW : x;
      const ly = y + i * L;
      const lineA = reveal ? reveal(i) : 1;
      if (lineA <= 0) return;
      ctx.save(); ctx.globalAlpha *= lineA;
      if (hl) { // highlight boxes behind accent runs
        let run = null; const runs = [];
        ln.forEach(tk => { if (tk.acc) { if (!run) { run = { x0: tk.x, x1: tk.x + tk.width }; runs.push(run); } else run.x1 = tk.x + tk.width; } else run = null; });
        runs.forEach(r => { const w = (r.x1 - r.x0 + size * .5) * hl.p; fillRect(ox + r.x0 - size * .25, ly - size * .86, w, size * 1.12, hl.color); });
      }
      ln.forEach(tk => { ctx.font = font(size, tk.wt); ctx.fillStyle = tk.acc ? acc : color; ctx.fillText(tk.w, ox + tk.x, ly); });
      ctx.restore();
    });
  }
  return { lines: lines.length, h: lines.length * L };
}

function drawCover(im, x, y, w, h, zoom = 1, fx = .5, fy = .5) {
  if (!im.complete || !im.naturalWidth) { fillRect(x, y, w, h, '#222'); return; }
  const ir = im.naturalWidth / im.naturalHeight, r = w / h;
  let sw, sh; if (ir > r) { sh = im.naturalHeight / zoom; sw = sh * r; } else { sw = im.naturalWidth / zoom; sh = sw / r; }
  const sx = (im.naturalWidth - sw) * fx, sy = (im.naturalHeight - sh) * fy;
  ctx.drawImage(im, sx, sy, sw, sh, x, y, w, h);
}

let T = 0; // global clock (continuous across scenes) for ambient motion
const grain = (() => {
  const g = document.createElement('canvas'); g.width = g.height = 220; const gx = g.getContext('2d');
  const id = gx.createImageData(220, 220); const r = rng(7);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gx.putImageData(id, 0, 0); return g;
})();
let grainPat = null;
function addGrain(a = .045) {
  if (!grainPat) grainPat = ctx.createPattern(grain, 'repeat');
  ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W, H); ctx.restore();
}

function blobs(set) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  set.forEach((b, i) => {
    const x = b.x + Math.sin(T * b.s + i * 2.1) * b.dx, y = b.y + Math.cos(T * b.s * 1.3 + i) * b.dy;
    const g = ctx.createRadialGradient(x, y, 0, x, y, b.r);
    g.addColorStop(0, rgba(b.c, b.a)); g.addColorStop(.45, rgba(b.c, b.a * .45)); g.addColorStop(1, rgba(b.c, 0));

  });
  ctx.restore();
}

const SPH = (() => {

})();
function sphere(cx, cy, R, a = 1, linkA = 1) {

  const P = SPH.pts.map(([x, y, z]) => { const x1 = x * ca + z * sa, z1 = -x * sa + z * ca; const y2 = y * ct - z1 * st, z2 = y * st + z1 * ct; return [cx + x1 * R, cy + y2 * R, (z2 + 1) / 2]; });

  ctx.strokeStyle = rgba(C.lilac, .45); ctx.lineWidth = 1.4; ctx.stroke();
  ctx.lineWidth = 1;
  SPH.edges.forEach(([i, j]) => { const d = (P[i][2] + P[j][2]) / 2; ctx.strokeStyle = `rgba(${Math.round(lerp(150, 200, d))},${Math.round(lerp(110, 210, d))},255,${(.12 + .5 * d) * linkA})`; ctx.beginPath(); ctx.moveTo(P[i][0], P[i][1]); ctx.lineTo(P[j][0], P[j][1]); ctx.stroke(); });

const LEVEL_NAMES = [['DELIVERY', 'ORGANIZATION'], ['PRODUCT-LED', 'DELIVERY', 'ORGANIZATION'], ['PRODUCT-LED', 'BUSINESS', 'ORGANIZATION']];
function maturityChart(ox, oy, R, t, o = {}) {
  const { dark = true, active = -1, sweep = true, dim = 1, labels = true, lsize = 16 } = o;
  const radii = [R * .36, R * .68, R];
  const axisCol = dark ? rgba(C.white, .85) : C.ink;
  const ap = sweep ? easeO(prog(t, 0, .6)) : 1;
  // bands (outer first, inner on top)
  for (let i = 2; i >= 0; i--) {
    const st = .45 + i * .22, p = sweep ? ease(prog(t, st, st + .75)) : 1;
    if (p <= 0) continue;
    const ang = Math.PI / 2 * p;
    let col = LV[i]; if (active >= 0 && i !== active) col = dark ? rgba('#FFFFFF', .08 + i * .03) : LV_LIGHT[i];
    ctx.save(); ctx.globalAlpha *= (active === -1 ? dim : 1);

}

function tree(x0, y0, s, t, start = .5, dark = false) {

function curveArrow(ax, ay, bx, by, bend, color, p, lw = 3) {
  if (p <= 0) return;
  const mx = (ax + bx) / 2 + bend[0], my = (ay + by) / 2 + bend[1];
  const N = 40, pts = []; for (let i = 0; i <= N * p; i++) { const u = i / N; pts.push([(1 - u) * (1 - u) * ax + 2 * (1 - u) * u * mx + u * u * bx, (1 - u) * (1 - u) * ay + 2 * (1 - u) * u * my + u * u * by]); }
  if (pts.length < 2) return;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  const [x1, y1] = pts[pts.length - 1], [x0, y0] = pts[pts.length - 2]; const a = Math.atan2(y1 - y0, x1 - x0);
  ctx.save(); ctx.translate(x1, y1); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-12, -8); ctx.lineTo(-12, 8); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.lineCap = 'butt';
}

  });
  const F = { x: 340, y: 600, r: 105 }, A = { x: 820, y: 600, r: 105 };
  const node = (n, col, txt, st) => E(t, st, () => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill(); fillText(txt, n.x, n.y + 2, { size: 30, weight: 700, color: C.white, align: 'center', base: 'middle' }); });
  node(F, C.purple, 'Firm', .5); node(A, C.blue, 'Agent', .7);
  // Firm <-> Agent
  const pa = ease(prog(t, .9, 1.5)), pr = ease(prog(t, 1.1, 1.7));
  curveArrow(F.x + F.r + 14, F.y - 40, A.x - A.r - 14, A.y - 40, [0, -40], C.purple, pa, 4);
  curveArrow(A.x - A.r - 14, A.y + 40, F.x + F.r + 14, F.y + 40, [0, 40], C.blue, pr, 4);
  E(t, 1.3, () => { eyebrow('Authority', (F.x + A.x) / 2, F.y - 100, C.purple, 'center'); eyebrow('Results', (F.x + A.x) / 2, F.y + 120, C.blue, 'center'); });
  // cascade
  const boxes = [{ x: 1180, y: 560, t: 'CPO', s: 'or equivalent' }, { x: 1430, y: 720, t: 'Product Leads' }, { x: 1680, y: 880, t: 'Product Owners' }];
  boxes.forEach((b, i) => {
    const st = 1.4 + i * .35;
    const bx = b.x - 120, by = b.y - 38;
    if (i === 0) {
      curveArrow(A.x + A.r + 12, A.y - 30, bx - 10, by + 22, [0, -30], C.purple, ease(prog(t, st, st + .4)), 3);
      curveArrow(bx - 10, by + 56, A.x + A.r + 12, A.y + 30, [0, 30], C.blue, ease(prog(t, st + .2, st + .6)), 3);
    } else {
      const p = boxes[i - 1], px = p.x - 120, py = p.y - 38;
      curveArrow(px + 190, py + 84, bx + 60, by - 8, [50, -10], C.purple, ease(prog(t, st, st + .4)), 3);
      curveArrow(bx - 10, by + 38, px + 110, py + 84, [-50, 20], C.blue, ease(prog(t, st + .2, st + .6)), 3);
    }
    E(t, st + .2, () => {
      fillRect(bx, by, 240, 76, C.ink);
      fillRect(bx, by, 5, 76, i === 0 ? C.purple : i === 1 ? '#6A2BFF' : C.blue);
      if (b.s) { fillText(b.t, b.x + 2, b.y - 4, { size: 24, weight: 700, color: C.white, align: 'center' }); fillText(b.s, b.x + 2, b.y + 22, { size: 16, weight: 500, color: rgba(C.white, .65), align: 'center' }); }
      else fillText(b.t, b.x + 2, b.y + 8, { size: 23, weight: 700, color: C.white, align: 'center' });
    });
  });
  footnote('Source: Teresa Torres (2021), Continuous Discovery Habits.', ML, 950, false);
  edge('Agency', false);
  footer(false);
}

// 22 — Opportunity Solution Tree
function scTree(t) {
  bgLight(C.paper); backLink(false);
  E(t, .1, () => label('Shift 02  ·  Customer knowledge', ML, 180, C.gray, 26));
  E(t, .2, () => headline('Opportunity Solution *Tree*', ML, 262, 900, { size: 60, color: C.ink, acc: C.blue }));
  E(t, .35, () => rich('Connect the outcomes you want to the *customer opportunities*, solutions, and experiments that drive them.', ML, 340, 640, { size: 24, color: C.gray, acc: C.ink, accWeight: 700, lh: 1.4 }));
  tree(820, 290, .95, t, .5);
  footnote('Source: Teresa Torres (2021), Continuous Discovery Habits.', ML, 950, false);
  edge('Customer knowledge', false);
  footer(false);
}
// 23 & 25 — Tree explained (split)
function treeSplit(t, labelStr, title, items, big) {
  bgLight(C.paper);
  // left dark panel
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 780, H); ctx.clip(); bgDark('left'); ctx.restore();
  // notch (reference arrow-cut edge)
  ctx.fillStyle = C.paper; ctx.beginPath(); ctx.moveTo(780, 880); ctx.lineTo(760, 910); ctx.lineTo(780, 940); ctx.closePath(); ctx.fill();
  backLink(true);
  E(t, .1, () => label(labelStr, ML, 150, rgba(C.lilac, .95), 24));
  E(t, .2, () => headline(title, ML, 222, 640, { size: 48, color: C.white, acc: C.lilac }));
  const L = tree(900, 360, .9, t, .3).levels;
  items.forEach((s, i) => {
    const y = L[i];
    E(t, .5 + i * .3, () => {
      if (big) {
        fillText('0' + (i + 1), ML, y + 8, { size: 18, weight: 700, color: rgba(C.white, .5), ls: 1 });
        rich(s, ML + 50, y + 11, 560, { size: 30, weight: 700, color: C.white, acc: C.lilac, lh: 1.2 });
      } else {
        const h = rich(s, ML, 0, 570, { size: 22, draw: false, lh: 1.38 }).h;
        rich(s, ML, y - h / 2 + 22, 570, { size: 22, color: rgba(C.white, .85), acc: C.lilac, accWeight: 700, lh: 1.38 });
      }
      // dotted leader into the tree
      ctx.fillStyle = rgba(C.ink, .6); for (let x = 800; x < 880; x += 12) { ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill(); }
      ctx.beginPath(); ctx.arc(886, y, 6, 0, Math.PI * 2); ctx.fill();
    });
  });
  footer(true, false);
}
function scTreeExplained(t) {
  treeSplit(t, 'Reading the tree', 'From objectives to *experiments*', [
    'Business results = *objectives*, driven by executive direction from strategy or corporate mandates set by the “agent.”',
    'Opportunities designed to resolve discovered *customer problems* or challenges.',
    'Solutions designed to address the identified opportunities (*product initiatives = key results*).',
    'The product experiments or *epics* that form the solution, tracked with *KPIs.*'
  ], false);
}
function scTreeMeasured(t) {
  treeSplit(t, 'Shift 03  ·  Measurement', 'What to measure at *every level*', [
    'Business *Objectives* (Os)',
    'Product *Portfolios* & Teams',
    'Product *Initiatives* & Roadmap',
    '*Epics* and Key Results (KRs)'
  ], true);
}

// 26 — Close
function scClose(t) {
  bgDark('cover');
  ribbon(1500, 520, 420, 300, -.6, 60, '#9DB4FF', .3, 7);
  ribbon(1560, 560, 300, 200, -.6, 40, '#E2A6FF', .22, 6);
  backLink(true);
  E(t, .2, () => fillText('Thanks…', ML, 470, { size: 120, weight: 700, color: C.white }));
  E(t, .45, () => fillText('Let’s elevate your product practice.', ML, 550, { size: 34, weight: 500, color: rgba(C.white, .85) }));
  E(t, .7, () => { arrowIcon(ML + 20, 652, 20, rgba(C.white, .85)); fillText('finably.ca', ML + 62, 662, { size: 30, weight: 500, color: C.white }); });
  E(t, 1.0, () => logo(ML, 830, 92, C.white, C.lilac));
}

/* =====================================================================
   RUNNER & NAVIGATION
   ===================================================================== */
const SCENES = [
  scCover, scQualifiers, scPattern1, scPattern2, scPattern3, scChallenge, scAnswer,
  scSystems, scBroken, scAnatomy, scPrinciples, scModel, scLevel1, scLevel2, scLevel3,
  scRules, scCone, scWhere, scChoice, scShift1, scCascade, scShift2, scTree, scTreeExplained,
  scShift3, scTreeMeasured, scClose
];
let scene = 0, t = 0, lastTs = null, running = true;
// deep-link support: #5 opens scene 5
const fromHash = parseInt(location.hash.slice(1), 10); if (!isNaN(fromHash)) scene = clamp(fromHash, 0, SCENES.length - 1);
progFrom = progTo = scene / (SCENES.length - 1);

function loop(ts) {
  if (!running) return;
  if (lastTs !== null) { const dt = Math.min((ts - lastTs) / 1000, .1); t += dt; T += dt; }
  lastTs = ts;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  SCENES[scene](t);
  requestAnimationFrame(loop);
}
function go(n) {
  n = clamp(n, 0, SCENES.length - 1); if (n === scene) return;
  progFrom = lerp(progFrom, progTo, easeO(prog(t, 0, .8)));
  scene = n; t = 0; lastTs = null; progTo = scene / (SCENES.length - 1);
  history.replaceState(null, '', '#' + scene);
}
function nextScene() { go(scene + 1); }
function prevScene() { go(scene - 1); }
function restart() { go(0); t = 0; }
function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter' || e.key === 'PageDown') { e.preventDefault(); nextScene(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prevScene(); }
  if (e.key === 'Home') go(0);
  if (e.key === 'End') go(SCENES.length - 1);
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === 'r' || e.key === 'R') restart();
});
function toCanvas(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
const inBack = p => p.x >= BACK.x && p.x <= BACK.x + BACK.w && p.y >= BACK.y && p.y <= BACK.y + BACK.h;
cv.addEventListener('click', e => {
  const p = toCanvas(e);
  if (inBack(p)) { location.href = '../'; return; }
  p.x > W / 2 ? nextScene() : prevScene();
});
cv.addEventListener('mousemove', e => { cv.style.cursor = inBack(toCanvas(e)) ? 'pointer' : 'default'; });
let touchX = 0, touchY = 0, swiped = false;
cv.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; swiped = false; }, { passive: true });
cv.addEventListener('touchend', e => {
  const dx = touchX - e.changedTouches[0].clientX, dy = touchY - e.changedTouches[0].clientY;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { swiped = true; dx > 0 ? nextScene() : prevScene(); e.preventDefault(); }
});
setTimeout(() => { const h = document.getElementById('hint'); if (h) h.style.opacity = 0; }, 6000);

// Start once fonts are ready (with a fallback so it never hangs)
const fontLoads = ['300', '400', '500', '600', '700', '800'].map(w => document.fonts.load(`${w} 40px Raleway`)).concat([document.fonts.load('italic 400 40px Raleway'), document.fonts.load('italic 500 40px Raleway')]);
Promise.race([Promise.all(fontLoads), new Promise(r => setTimeout(r, 2500))]).then(() => requestAnimationFrame(loop));
</script>
