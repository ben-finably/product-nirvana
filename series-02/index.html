const A = document.getElementById('a'), B = document.getElementById('b');
let cur = 0, front = A, back = B;
const cache = {};
function preload(i) { if (i >= 0 && i < N && !cache[i]) { const im = new Image(); im.src = src(i); cache[i] = im; } }
function show(i, instant) {
  i = Math.max(0, Math.min(N - 1, i));
  cur = i;
  back.src = src(i); back.alt = ALT[i] || `Slide ${i + 1}`;
  const swap = () => { back.style.opacity = 1; front.style.opacity = 0; [front, back] = [back, front]; };
  if (instant || back.complete) swap(); else back.onload = () => { back.onload = null; swap(); };
  document.getElementById('progress').style.width = ((i + 1) / N * 100) + '%';
  document.getElementById('count').textContent = String(i + 1).padStart(2, '0') + ' / ' + N;
  document.getElementById('live').textContent = `Slide ${i + 1} of ${N}: ${ALT[i] || ''}`;
  history.replaceState(null, '', '#' + (i + 1));
  [i + 1, i + 2, i - 1].forEach(preload);
}
const next = () => cur < N - 1 && show(cur + 1), prev = () => cur > 0 && show(cur - 1);
function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
document.addEventListener('keydown', e => {
  if (['ArrowRight', ' ', 'Enter', 'PageDown'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'Home') show(0); else if (e.key === 'End') show(N - 1);

  else if (e.key === 'r' || e.key === 'R') show(0);
});
