const W = 1920, H = 1080;

const ctx = cv.getContext('2d');

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);

}

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog  = (t, a, b) => clamp((t - a) / (b - a));

// ---------- Utilities ----------

function fillText(str, x, y, o = {}) {
  const { size = 20, weight = 400, color = C.ink, align = 'left', base = 'alphabetic', style = '', ls = 0 } = o;
  ctx.font = font(size, weight, style); ctx.fillStyle = color; ctx.textBaseline = base;

// Rich text: *word* = accent. Returns height. Supports \n.
function parseRich(s) {
  const toks = []; let acc = false, glue = false;
  for (const p of s.split(/(\*|\n)/)) {
    if (p === '*') { acc = !acc; continue; }
    if (p === '\n') { toks.push({ br: true }); glue = false; continue; }
    if (!p) continue;
    p.split(' ').forEach((w, i) => {
      if (i > 0) glue = false;
      if (w === '') return;
      const prev = toks[toks.length - 1];
      toks.push({ w, acc, glue: glue && prev && !prev.br });
      glue = true;
    });

}

  const toks = parseRich(s);
  ctx.font = font(size, weight); const space = ctx.measureText(' ').width;
  const lines = [[]]; let lw = 0;
  for (const tk of toks) {
    if (tk.br) { lines.push([]); lw = 0; continue; }
    tk.wt = tk.acc && accWeight ? accWeight : weight;
    ctx.font = font(size, tk.wt); tk.width = ctx.measureText(tk.w).width;
    const cur = lines[lines.length - 1];
    const gap = cur.length && !tk.glue ? space : 0;
    if (cur.length && !tk.glue && lw + gap + tk.width > maxW) { tk.x = 0; lines.push([tk]); lw = tk.width; }
    else { tk.x = lw + gap; cur.push(tk); lw += gap + tk.width; }
  }
  const L = size * lh;
  if (draw) {
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    lines.forEach((ln, i) => {
      if (!ln.length) return;
      const lineW = ln[ln.length - 1].x + ln[ln.length - 1].width;
      const ox = align === 'center' ? x - lineW / 2 : align === 'right' ? x - lineW : x;
      const ly = y + i * L;
      const lineA = reveal ? reveal(i) : 1;
      if (lineA <= 0) return;
      ctx.save(); ctx.globalAlpha *= lineA;
      if (hl) { // highlight boxes behind accent runs
        let run = null; const runs = [];
        ln.forEach(tk => { if (tk.acc) { if (!run) { run = { x0: tk.x, x1: tk.x + tk.width }; runs.push(run); } else run.x1 = tk.x + tk.width; } else run = null; });

      }
      ln.forEach(tk => { ctx.font = font(size, tk.wt); ctx.fillStyle = tk.acc ? acc : color; ctx.fillText(tk.w, ox + tk.x, ly); });
      ctx.restore();
    });
  }
  return { lines: lines.length, h: lines.length * L };
}

  let sw, sh; if (ir > r) { sh = im.naturalHeight / zoom; sw = sh * r; } else { sw = im.naturalWidth / zoom; sh = sw / r; }

// ---------- Network sphere (systems) ----------
const SPH = (() => {
  const N = 120, pts = [], edges = [], ga = Math.PI * (3 - Math.sqrt(5)), r = rng(11);
  for (let i = 0; i < N; i++) {

})();
function sphere(cx, cy, R, a = 1, linkA = 1) {

  const P = SPH.pts.map(([x, y, z]) => { const x1 = x * ca + z * sa, z1 = -x * sa + z * ca; const y2 = y * ct - z1 * st, z2 = y * st + z1 * ct; return [cx + x1 * R, cy + y2 * R, (z2 + 1) / 2]; });

  g.addColorStop(0, 'rgba(110,150,255,.20)'); g.addColorStop(.7, 'rgba(60,40,200,.10)'); g.addColorStop(1, 'rgba(186,0,255,.16)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = rgba(C.lilac, .45); ctx.lineWidth = 1.4; ctx.stroke();
  ctx.lineWidth = 1;
  SPH.edges.forEach(([i, j]) => { const d = (P[i][2] + P[j][2]) / 2; ctx.strokeStyle = `rgba(${Math.round(lerp(150, 200, d))},${Math.round(lerp(110, 210, d))},255,${(.12 + .5 * d) * linkA})`; ctx.beginPath(); ctx.moveTo(P[i][0], P[i][1]); ctx.lineTo(P[j][0], P[j][1]); ctx.stroke(); });

}

// ---------- Maturity chart ----------
const LEVEL_NAMES = [['DELIVERY', 'ORGANIZATION'], ['PRODUCT-LED', 'DELIVERY', 'ORGANIZATION'], ['PRODUCT-LED', 'BUSINESS', 'ORGANIZATION']];
function maturityChart(ox, oy, R, t, o = {}) {
  const { dark = true, active = -1, sweep = true, dim = 1, labels = true, lsize = 16 } = o;
  const radii = [R * .36, R * .68, R];

  // bands (outer first, inner on top)

    const st = .45 + i * .22, p = sweep ? ease(prog(t, st, st + .75)) : 1;
    if (p <= 0) continue;
    const ang = Math.PI / 2 * p;
    let col = LV[i]; if (active >= 0 && i !== active) col = dark ? rgba('#FFFFFF', .08 + i * .03) : LV_LIGHT[i];
    ctx.save(); ctx.globalAlpha *= (active === -1 ? dim : 1);
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.arc(ox, oy, radii[i], 0, -ang, true); ctx.closePath(); ctx.fill();
    ctx.restore();

    const x = i === 0 ? ox + radii[0] * .48 : ox + (radii[i - 1] + radii[i]) / 2;

    ctx.save(); ctx.globalAlpha *= a;

}
function cone(ox, oy, R, p, a1 = 22, a2 = 64) {

// ---------- Opportunity Solution Tree ----------
// Coordinates in tree space (1100 x 640), drawn at (x0,y0) with scale s.
const TREE = {
  root: { x: 550, y: 40, w: 300, h: 84, t: 'Expected Results' },
  opp:  [{ x: 230, y: 190, s: '1' }, { x: 550, y: 190, s: '2' }, { x: 870, y: 190, s: 'N' }],
  sol:  [{ x: 110, y: 330, s: '1' }, { x: 340, y: 330, s: '2' }, { x: 570, y: 330, s: 'N' }],
  exp:  [{ x: 250, y: 440, s: '1' }, { x: 420, y: 515, s: '2' }, { x: 590, y: 590, s: '3' }]

function subLabel(main, sub, x, y, size, color, weight = 700) {
  ctx.font = font(size, weight); const w1 = ctx.measureText(main).width; ctx.font = font(size * .62, weight); const w2 = ctx.measureText(sub).width;
  const sx = x - (w1 + w2 + 2) / 2;

}
function tree(x0, y0, s, t, start = .5, dark = false) {
  const X = v => x0 + v * s, Y = v => y0 + v * s;

  const lv = k => ease(prog(t, start + k * .35, start + k * .35 + .5));
  const link = (ax, ay, bx, by, p) => { // curved connector with arrowhead, drawn progressively

    ctx.fillStyle = C.purple; ctx.beginPath(); ctx.ellipse(X(r.x), Y(r.y), r.w / 2 * s, r.h / 2 * s, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = dark ? '#2A2F4A' : '#DCE4FF'; rrect(X(so.x - 95), Y(so.y - 30), 190 * s, 60 * s, 10 * s); ctx.fill();
    subLabel('Solution', so.s, X(so.x), Y(so.y), 21 * s, dark ? C.white : C.ink);

    ctx.restore();
  }
  TREE.exp.forEach((e, i) => enter(ease(prog(t, start + 1.05 + i * .1, start + 1.55 + i * .1)), 0, () => {

}


const SERIES = [
  { n: '01', title: 'Your product practice may need an overhaul', tag: 'Transform your product teams with a maturity framework', href: './series-01/', live: true },
  { n: '02', title: '10X Agile', tag: 'A product development method for teams building with AI', href: './series-02/', live: true },
  { n: '03', title: 'Coming soon', tag: 'The next deck in the series', href: null, live: false }
];
let t = 0, lastTs = null, hover = -1; const scene = 0; const SCENES = [0];
const CARD = i => ({ x: 110 + i * 580, y: 560, w: 540, h: 330 });
function hubScene(t) {

function loop(ts) { if (lastTs !== null) { const dt = Math.min((ts - lastTs) / 1000, .1); t += dt; T += dt; } lastTs = ts;
